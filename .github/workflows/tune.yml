name: Tune platform dispatch

run-name: Tune ${{ inputs.stage }} (${{ inputs.mode }}) on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Measure crossovers or validate the profile headers on this branch
        type: choice
        default: survey
        options: [survey, validate]
      mode:
        description: Crossover sweep size (survey only)
        type: choice
        default: full
        options: [full, quick]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      baseline: ${{ steps.matrix.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          BASELINE_BRANCH: ${{ github.event.repository.default_branch }}
          STAGE: ${{ inputs.stage }}
        shell: bash
        run: |
          echo "platforms=$(jq -c . .github/platforms.json)" >> "$GITHUB_OUTPUT"
          if [[ "$STAGE" == validate ]]; then
            baseline=$(git ls-remote --exit-code origin "refs/heads/$BASELINE_BRANCH" | cut -f1)
            [[ "$baseline" =~ ^[a-f0-9]{40}$ ]]
            echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          fi

  benchmark:
    name: ${{ inputs.stage }} ${{ matrix.key }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platforms) }}
    env:
      CXX: ${{ matrix.cxx }}
      BIGMATH_CPU: ${{ matrix.cpu }}
      PLATFORM_KEY: ${{ matrix.key }}
      TUNING_STAGE: ${{ inputs.stage }}
      TUNING_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: inputs.stage == 'validate'
        with:
          ref: ${{ needs.plan.outputs.baseline }}
          path: build/tune-baseline-source
          sparse-checkout: include/biginteger/build/platform
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Benchmark on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/scripts/tune-platform.sh
      - name: Benchmark on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/scripts/tune-platform.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.stage }}-${{ matrix.key }}
          path: build/tuning-results/
          if-no-files-found: warn

  summary:
    if: inputs.stage == 'validate'
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: validate-*
          path: results
      - name: Compare held-out timings
        run: |
          python3 .github/scripts/compare-tuning.py results/validate-* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: validation-comparison
          path: results/*/comparison.csv
          if-no-files-found: error
